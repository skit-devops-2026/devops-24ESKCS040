global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'elara'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['web:80']
        labels:
          app: 'elara'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
