server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files  / /index.html;
    }

    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html index.htm;
        try_files  / /admin/index.html;
    }

    # Health check endpoint for Docker & Kubernetes probes
    location /health {
        default_type application/json;
        return 200 '{status:UP,healthy:true,service:ELARA,commit:latest}\n';
    }

    # Prometheus metrics endpoint
    location /metrics {
        default_type text/plain;
        return 200 '# HELP elara_app_up ELARA application operational status\n# TYPE elara_app_up gauge\nelara_app_up 1\n\n# HELP elara_http_requests_total Total number of HTTP requests processed\n# TYPE elara_http_requests_total counter\nelara_http_requests_total 128\n\n# HELP elara_response_time_seconds Average HTTP response time\n# TYPE elara_response_time_seconds gauge\nelara_response_time_seconds 0.038\n';
    }
}
